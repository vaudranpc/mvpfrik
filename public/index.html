<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>mvpfrik – Journal d'information</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght=500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-dark text-light">
    <!-- HEADER / NAVBAR -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary shadow-sm"
    >
      <div class="container">
        <a class="navbar-brand fw-bold text-uppercase tracking-wide" href="#">
          mvpfrik
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <div class="btn-group" role="group" aria-label="Onglets mvpfrik">
            <button
              data-tab="home"
              class="tab-btn btn btn-outline-light active"
            >
              Accueil
            </button>
            <button data-tab="by-date" class="tab-btn btn btn-outline-light">
              Par jour
            </button>
            <button data-tab="by-country" class="tab-btn btn btn-outline-light">
              Par pays
            </button>
            <button
              data-tab="publish"
              class="tab-btn btn btn-light text-dark fw-bold"
            >
              Publier
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container my-4">
      <!-- ACCUEIL -->
      <section id="tab-home" class="tab active">
        <h1 class="display-6 border-bottom border-secondary pb-2 mb-4">
          Dernières actualités
        </h1>
        <div id="home-articles" class="row gy-4"></div>
      </section>

      <!-- PAR JOUR -->
      <section id="tab-by-date" class="tab">
        <h1 class="display-6 border-bottom border-secondary pb-2 mb-4">
          Articles par jour
        </h1>

        <form id="date-form" class="row gy-2 gx-3 mb-4">
          <div class="col-sm-6 col-md-4">
            <label for="jour-input" class="form-label"> Jour du journal </label>
            <input type="date" id="jour-input" class="form-control" />
          </div>
        </form>

        <div id="date-articles" class="row gy-4"></div>
      </section>

      <!-- PAR PAYS -->
      <section id="tab-by-country" class="tab">
        <h1 class="display-6 border-bottom border-secondary pb-2 mb-4">
          Articles par pays
        </h1>

        <form id="country-form" class="row gy-2 gx-3 mb-4">
          <div class="col-sm-6 col-md-4">
            <label for="pays-input" class="form-label">Pays</label>
            <select id="pays-input" class="form-select">
              <option value="">-- Choisir un pays --</option>
              <option value="Côte d'Ivoire">Côte d'Ivoire</option>
              <option value="Sénégal">Sénégal</option>
              <option value="Mali">Mali</option>
              <option value="Cameroun">Cameroun</option>
              <option value="Burkina Faso">Burkina Faso</option>
              <option value="Niger">Niger</option>
              <option value="Algérie">Algérie</option>
              <option value="Maroc">Maroc</option>
              <option value="Tunisie">Tunisie</option>
              <option value="Autre">Autre</option>
            </select>
          </div>
        </form>

        <div id="country-articles" class="row gy-4"></div>
      </section>

      <!-- PUBLIER -->
      <section id="tab-publish" class="tab">
        <h1 class="display-6 border-bottom border-secondary pb-2 mb-4">
          Publier une nouvelle information
        </h1>

        <div class="row">
          <div class="col-lg-8">
            <form
              id="publish-form"
              class="article-form card bg-body text-body shadow-sm p-3 p-md-4"
            >
              <div class="mb-3">
                <label class="form-label">Titre</label>
                <input type="text" name="titre" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label">Pays</label>
                <select name="pays" class="form-select">
                  <option value="">-- Choisir un pays --</option>
                  <option value="Côte d'Ivoire">Côte d'Ivoire</option>
                  <option value="Sénégal">Sénégal</option>
                  <option value="Mali">Mali</option>
                  <option value="Cameroun">Cameroun</option>
                  <option value="Burkina Faso">Burkina Faso</option>
                  <option value="Niger">Niger</option>
                  <option value="Algérie">Algérie</option>
                  <option value="Maroc">Maroc</option>
                  <option value="Tunisie">Tunisie</option>
                  <option value="Autre">Autre</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Jour</label>
                <input type="date" name="jour" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label">Contenu</label>
                <textarea
                  name="contenu"
                  rows="6"
                  class="form-control"
                ></textarea>
              </div>

              <div class="mb-3">
                <label class="form-label">Image (fichier, optionnel)</label>
                <input
                  type="file"
                  id="image-file"
                  accept="image/*"
                  class="form-control"
                />
              </div>

              <!-- base64 cachée -->
              <input type="hidden" name="imageBase64" id="image-base64" />

              <button type="submit" class="btn btn-light text-dark fw-bold">
                Publier
              </button>
              <p id="publish-message" class="mt-2 small"></p>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="border-top border-secondary py-3 mt-4 bg-black">
      <div class="container text-center text-muted small">
        &copy; <span id="year"></span> mvpfrik
      </div>
    </footer>

    <!-- MODALE ARTICLE (ZOOM JOURNAL) -->
    <div id="article-modal" class="article-modal">
      <div class="article-modal-dialog card bg-body text-body">
        <button
          class="modal-close btn btn-sm btn-outline-secondary"
          aria-label="Fermer"
        >
          &times;
        </button>
        <div class="card-body">
          <div class="row g-4 align-items-start modal-body-custom">
            <!-- Colonne image -->
            <div class="col-md-5" id="modal-image-col">
              <div
                class="modal-image border bg-black d-flex align-items-center justify-content-center p-2"
              ></div>
            </div>
            <!-- Colonne texte -->
            <div class="col-md-7" id="modal-text-col">
              <div class="modal-text"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
